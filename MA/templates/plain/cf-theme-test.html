<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temp Test - Cloudflare Green Theme</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

:root{
  --bg-0:#16063a;
  --border:#333333;
  --text:#e0e0e0;
  --text-dim:#888888;
  --accent:#00ff41;
  --accent-dim:rgba(0,255,65,0.2);
  --accent-2:#008F11;
  --c-warn: #f59e0b;
  --c-primary: #8b5cf6;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-mono);
  background:var(--bg-0);
  color:var(--text);
  padding:40px;
}

/* === CURRENT (amber/warn theme) === */
.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  color: #ff4444;
}

.cloudflare-config-current {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(239, 68, 68, 0.1) 100%);
  border-left: 3px solid var(--c-warn);
  border-radius: 4px;
  padding: 10px;
  margin: 0 0 40px 0;
  box-shadow: 0 4px 20px rgba(245, 158, 11, 0.1);
  transition: all 0.3s ease;
}

.cloudflare-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(245, 158, 11, 0.3);
}

.cloudflare-title {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 10px;
  font-weight: 700;
  color: var(--c-warn);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.cloudflare-icon {
  width: 24px;
  height: 24px;
  background: var(--c-warn);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: white;
  box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
}

/* === PROPOSED (green theme, matching Page Config / Link Bot / Telegram) === */
.section-label-green {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  color: var(--accent);
}

.cloudflare-config-green {
  border: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  transition: all 0.3s ease;
  border-left: 5px solid var(--accent-2);
  padding: 6px;
  margin: 6px 0;
}

.cloudflare-config-green .cloudflare-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: none;
}

.cloudflare-config-green .cloudflare-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
}

.cloudflare-config-green .cloudflare-icon {
  display: none;
}

.cloudflare-config-green .cloudflare-content {
  display: block;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--accent-dim);
}

/* Sample inner elements to show theme */
.unified-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.unified-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 6px;
}

.unified-status {
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 6px;
  padding: 2px 0;
}

.unified-features {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.feature-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 8px;
  background: rgba(255,255,255,0.03);
  border-radius: 4px;
}

.feature-text {
  font-size: 11px;
}

.feature-status {
  font-size: 12px;
}

.cloudflare-toggle {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
}
.cloudflare-toggle input { opacity:0; width:0; height:0; }
.cloudflare-slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: rgba(255,255,255,0.1);
  transition: .3s;
  border-radius: 22px;
}
.cloudflare-slider:before {
  position: absolute;
  content: "";
  height: 16px; width: 16px;
  left: 3px; bottom: 3px;
  background-color: white;
  transition: .3s;
  border-radius: 50%;
}
.cloudflare-toggle input:checked + .cloudflare-slider {
  background-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-dim);
}
.cloudflare-toggle input:checked + .cloudflare-slider:before {
  transform: translateX(18px);
}

.cloudflare-btn {
  padding: 4px 10px;
  font-size: 10px;
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid var(--accent-2);
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font-mono);
}
</style>
</head>
<body>

<div class="section-label">❌ CURRENT — Amber/Warn theme</div>
<div class="cloudflare-config-current">
  <div class="cloudflare-header">
    <div class="cloudflare-title">
      <div class="cloudflare-icon">☁️</div>
      Cloudflare
    </div>
  </div>
  <div style="padding: 10px; font-size: 11px; color: var(--text-dim);">
    Current: amber border, gradient background, small uppercase title, circle icon
  </div>
</div>

<div style="text-align:center; color: var(--accent); font-size:20px; margin: 10px 0;">↓</div>

<div class="section-label-green">✅ PROPOSED — Green theme (matching other General cards)</div>
<div class="cloudflare-config-green">
  <div class="cloudflare-header">
    <div class="cloudflare-title">
      ☁️ CLOUDFLARE
    </div>
  </div>
  <div class="cloudflare-content">
    <div class="unified-header">
      <div class="unified-title">
        ☁️ Cloudflare Security 
        <span style="display:inline-block;width:14px;height:14px;line-height:14px;text-align:center;border-radius:50%;border:1px solid var(--text-dim);color:var(--text-dim);font-size:10px;cursor:help;margin-left:4px;">?</span>
      </div>
      <label class="cloudflare-toggle">
        <input type="checkbox">
        <span class="cloudflare-slider"></span>
      </label>
    </div>
    <div class="unified-status" id="cfMasterStatusText">OFFLINE</div>
    
    <div class="unified-features">
      <div class="feature-item">
        <span class="feature-text">🔒 SSL/HTTPS</span>
        <span class="feature-status">❌</span>
      </div>
      <div class="feature-item">
        <span class="feature-text">🛡️ Bot Shield</span>
        <span class="feature-status">❌</span>
      </div>
      <div class="feature-item">
        <span class="feature-text">⚡ Under Attack</span>
        <span class="feature-status">❌</span>
      </div>
    </div>
    
    <div style="margin-top: 8px;">
      <button type="button" class="cloudflare-btn">Sync Status</button>
    </div>
  </div>
</div>

</body>
</html>
